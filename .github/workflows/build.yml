name: Build Android APK

on:
  push:
    branches: [ main, master, fix/favorite-contact-reordering ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        continue-on-error: true

      # This temporary key is only for installing and testing this CI build.
      # It will not match any existing production/release signing key.
      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore nexus.jks \
            -storepass nexus123 \
            -alias nexus \
            -keypass nexus123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nexus Connect CI Test, OU=Testing, O=Nexus Connect, L=CI, S=CI, C=US"

      - name: Build Debug and Release APKs
        run: gradle assembleDebug assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
