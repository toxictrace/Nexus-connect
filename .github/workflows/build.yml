name: Build Android APK

on:
  push:
    branches: [ main, master, fix/favorite-contact-reordering, diagnostics/widget-photo-refresh, diagnostic, rust-connection ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/nexus.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/phone_normalizer/Cargo.toml

      - name: Build Rust Android libraries
        working-directory: rust/phone_normalizer
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 --platform 26 -o ../../app/build/generated/rustJniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        continue-on-error: true

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "KEYSTORE_BASE64 secret is missing" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || (echo "Decoded keystore is empty" && exit 1)
          chmod 600 "$KEYSTORE_PATH"

      - name: Build Debug and Release APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease

      - name: Verify Release APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || (echo "Release APK is missing or empty" && exit 1)
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS" || (echo "Android build-tools not found" && exit 1)
          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1)" || { echo "$VERIFY_OUTPUT"; exit 1; }
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" || (echo "APK v2 signature verification failed" && exit 1)

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Read release version
        id: release_version
        run: |
          VERSION=$(grep -oE 'versionName "[^"]+"' app/build.gradle | head -n 1 | cut -d '"' -f 2)
          test -n "$VERSION" || (echo "versionName not found" && exit 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: ${{ !contains(steps.release_version.outputs.version, '-test') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          name: Nexus Connect v${{ steps.release_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
