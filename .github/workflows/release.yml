name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias nexus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore nexus.jks \
            -storepass nexus123 \
            -keypass nexus123 \
            -dname "CN=Nexus Connect, OU=Dev, O=NexusConnect, L=City, ST=State, C=US"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          $JAVA_HOME/bin/jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore nexus.jks \
            -storepass nexus123 \
            -keypass nexus123 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            nexus
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-signed.apk

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nexus Connect v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/app-release-signed.apk
          generate_release_notes: false
          body: |
            ## Nexus Connect v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `app-release-signed.apk`
            2. Install on Android 8.0+
            3. Add Nexus Connect widget to home screen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
