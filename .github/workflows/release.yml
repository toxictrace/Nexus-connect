name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > nexus.jks

      - name: Build and Sign Release APK
        env:
          KEYSTORE_PATH: nexus.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-connect-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nexus Connect v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: false
          body: |
            ## Nexus Connect v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `app-release-unsigned.apk`
            2. Install on Android 8.0+
            3. Add Nexus Connect widget to home screen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
